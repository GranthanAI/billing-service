# Services the integration tests reuse instead of starting containers on every run.
#   make test-up      start them (a few seconds; they keep running)
#   make test-down    remove them
# Non-default host ports, so they never collide with the dev services. The Makefile test targets
# set TEST_PG_URL, TEST_VALKEY_URL, TEST_VALKEY_LRU_URL and TEST_KAFKA_BOOTSTRAP to point here;
# without them the tests fall back to Testcontainers.
name: billing-test
services:
  postgres:
    image: postgres:17
    container_name: billing-test-postgres
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["55432:5432"]
    volumes:
      - ./deploy/sql/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U billing_app -d billing_db -c 'select 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40

  valkey:
    image: valkey/valkey:8
    container_name: billing-test-valkey
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "no", "--maxmemory-policy", "noeviction", "--databases", "32"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # the unsafe configuration /readyz must refuse
  valkey-lru:
    image: valkey/valkey:8
    container_name: billing-test-valkey-lru
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["56380:6379"]

  kafka:
    image: apache/kafka:3.8.0
    container_name: billing-test-kafka
    ports: ["59092:59092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:59092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
