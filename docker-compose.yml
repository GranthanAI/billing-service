# Billing needs only Valkey of its own. PostgreSQL and Kafka come from the shared stack in
# ../docker-compose.yml (`make -C .. infra`); the billing database is created by
# deploy/sql/roles.sql (mounted there as an init script, or run `make db-create`).
services:
  valkey:
    image: valkey/valkey:8
    container_name: billing-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    volumes:
      - billing_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  billing_valkey:
