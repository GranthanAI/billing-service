[project]
name = "billing-service"
version = "0.1.0"
description = "GranthanAI billing service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "valkey[libvalkey]>=6.0",
    "aiokafka>=0.11",
    "grpcio>=1.64",
    "grpcio-health-checking>=1.64",
    "grpcio-reflection>=1.64",
    "protobuf>=5.26",
    "httpx>=0.27",
    "jinja2>=3.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "opentelemetry-sdk>=1.25",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
    "uvloop>=0.19 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "types-grpcio-health-checking>=1.0",
    "types-grpcio-reflection>=1.0",
    "types-grpcio>=1.0",
    "types-protobuf>=5.26",
    "grpcio-tools>=1.64",
    "mypy-protobuf>=3.6",
    "types-pyyaml>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers>=4.7",
    "time-machine>=2.14",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["billing.domain"]

[tool.ruff]
extend-exclude = ["src/billing/gen"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["billing"]

[tool.importlinter]
root_package = "billing"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports only the standard library"
type = "forbidden"
source_modules = ["billing.domain"]
forbidden_modules = ["billing.app", "billing.adapters", "billing.api", "billing.jobs", "billing.settings", "billing.observability", "billing.main_api", "billing.main_worker",
  "fastapi", "pydantic", "pydantic_settings", "sqlalchemy", "asyncpg", "alembic", "valkey", "aiokafka", "grpc", "httpx", "jinja2", "structlog", "prometheus_client", "sentry_sdk", "opentelemetry", "starlette", "yaml"]

[[tool.importlinter.contracts]]
name = "app depends on domain and ports only"
type = "forbidden"
source_modules = ["billing.app"]
forbidden_modules = ["billing.adapters", "billing.api", "billing.jobs", "fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "generated protobuf code is only used by adapters and api"
type = "forbidden"
source_modules = ["billing.domain", "billing.app", "billing.settings", "billing.observability"]
forbidden_modules = ["billing.gen"]

[[tool.importlinter.contracts]]
name = "adapters do not import api"
type = "forbidden"
source_modules = ["billing.adapters"]
forbidden_modules = ["billing.api"]

[[tool.mypy.overrides]]
module = "billing.gen.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "billing.adapters.valkey.client"
disallow_untyped_calls = false
warn_return_any = false
